project: DeepEntry
release: 1.0.0
paths:
  data_root: ${DEEPENTRY_DATA_ROOT:-data}
  model_root: ${DEEPENTRY_MODEL_ROOT:-models}
  results_root: ${DEEPENTRY_RESULTS_ROOT:-results}
benchmark:
  protocol: 38-virus leave-one-virus-out receptor-candidate ranking
  candidate_pool: fixed human receptor-candidate pool
  primary_metrics:
    - MRR
    - Recall@10
    - Recall@20
model:
  encoder: frozen ESM-2 protein sequence representations
  ranker: listwise receptor-candidate ranker
  prior: controlled dynamic retrieval prior
audit:
  leakage_controls:
    - shared folds and candidate pool
    - training-known receptors removed from orthogonal host-factor analyses
    - assayed-gene null control for CRISPR/siRNA overlap
