[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepentry"
version = "1.1.0"
description = "Deep learning model and release utilities for virus-host receptor prediction (LOVO56)"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Junwen Luan"}]
dependencies = ["numpy", "pandas", "scipy", "pyyaml", "torch>=2.0"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["."]
include = ["models*"]
